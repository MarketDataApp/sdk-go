name: Tests

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  release:
    types: [published]
  # Reusable entry point. tag-and-release.yml calls this so the release gate
  # and ordinary CI are literally the same jobs — there is no second copy of
  # the suite to drift out of sync.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test. Empty means the triggering commit."
        required: false
        type: string
        default: ""
      run_integration:
        description: "Run the live integration suite (needs MARKETDATA_TOKEN)."
        required: false
        type: boolean
        default: false

jobs:
  changes:
    # A documentation-only pull request does not need the suite below. But a
    # required status check can never be conditional -- the list is static -- and
    # a matrix job that GitHub SKIPS does not expand its name, so it reports no
    # per-combination context at all and the pull request waits forever for
    # checks that never arrive. Measured on MarketDataApp/sdk-php#95.
    #
    # So `Tests passed` at the bottom is the single context branch protection
    # requires, and this job decides whether the suite does any work.
    name: Decide whether the suite applies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether anything but documentation changed
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only a pull request can be documentation-only here. A push, a release
          # and a workflow_call all run the suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request, so running the suite."
            exit 0
          fi

          # Every path out of here that is not a confident "documentation only"
          # says true. A gate that cannot see both ends of the diff must never
          # conclude that no code changed.
          for sha in "$BASE" "$HEAD"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "Cannot reach $sha, so running the suite rather than guessing."
              exit 0
            fi
          done

          # Three dots: the diff from the merge base, not from wherever the base
          # branch has moved to since.
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Inverted deliberately. This lists what DOCUMENTATION looks like and
          # runs the suite for everything else. Enumerating code paths instead
          # would skip the suite the first time somebody adds a source directory
          # nobody remembered to list.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: the suite skips, and Tests passed says so."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Something other than documentation changed: running the suite."
          fi

  unit-tests:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the declared minimum (go.mod's `go 1.22`) and the current
        # stable release, per SDK requirements §13 ("test multiple runtime
        # versions"). The go.mod toolchain pin was removed for the public
        # release, so each leg genuinely runs its own toolchain.
        go-version: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run full test suite
        # Plain, uncovered run of every package in the module, including
        # examples/coverage_test.go's cross-app SDK-method coverage guard.
        # The coverage-gated step below intentionally narrows to the SDK
        # packages only (see its comment), so this step is what actually
        # keeps the example apps (and everything else outside
        # marketdata/... and internal/...) compiling and passing in CI.
        run: go test -v -race ./...

      - name: Run unit tests
        # Coverage is scoped to the SDK packages only. examples/* holds
        # runnable reference apps (stockterm, optionterm, tuitest, ...),
        # several of which are main packages with no meaningful unit-test
        # surface of their own (they're exercised via the step above and
        # their own per-app test suites) — including them here would drag
        # total coverage down for reasons that have nothing to do with SDK
        # quality.
        run: go test -v -race -coverprofile=coverage.out ./marketdata/... ./internal/...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # ADR-010's 100% gate, restored 2026-07-27 after the QA coverage
          # pass closed every remaining gap (branch tests, detectVersion and
          # timezone loader refactors for testability, status-cache
          # placeholder removal). Every statement in marketdata/... and
          # internal/... is executed by the unit suite.
          if [ "$(echo "$COVERAGE < 100.0" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 100% gate"
            go tool cover -func=coverage.out | grep -v "100.0%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        # Mirrors the other Market Data SDKs (sdk-js/-java/-py/-php): upload the
        # coverage.out profile from the step above so the README Coverage badge
        # populates. fail_ci_if_error:false keeps CI green if CODECOV_TOKEN is
        # unset; this repo is public, so tokenless upload works either way.
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  govulncheck:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # govulncheck must analyze the newest patched stdlib: an older
          # toolchain re-flags stdlib CVEs that are fixed only in the latest
          # patch releases.
          go-version: 'stable'
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: Run govulncheck
        # The latest stable toolchain provides a patched standard library, so
        # this scan must be clean (zero reachable vulnerabilities in SDK code;
        # zero third-party runtime dependencies).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  negative-compile:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    name: Negative-Compile Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: Assert illegal parameter combinations do not compile
        # internal/negcompile builds a corpus of snippets combining
        # mutually-exclusive parameters and asserts each FAILS to build, while
        # the legal counterparts DO build.
        run: go test -v ./internal/negcompile/...

  integration-tests:
    name: Integration Tests
    needs: changes
    runs-on: ubuntu-latest
    # Run on releases, on all PRs, and whenever a calling workflow asks
    # (tag-and-release.yml does, so a release is gated on the live API).
    #
    # The existing clauses are parenthesised because the documentation gate is
    # ANDed onto all of them: a pull request that changes only markdown must not
    # spend live API quota. `!= 'false'` and not `== 'true'`, so a failed gate
    # still runs the suite.
    if: |
      (github.event_name == 'release' ||
      github.event_name == 'pull_request' ||
      inputs.run_integration) &&
      needs.changes.outputs.code != 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
        run: go test -v -race ./integration/... -tags=integration

  lint:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin a golangci-lint v2.x built with a current Go toolchain. The
          # v4 action's `version: latest` used to resolve to golangci-lint
          # v1.64.8 (the final v1 release), which cannot type-check modern
          # toolchain output; keep this roughly current with Go stable.
          #
          # This pin goes stale on its own whenever `go-version: stable`
          # advances: v2.12.2 was built with go1.25.12 and started failing the
          # moment Go 1.27.0 became stable, reporting typecheck errors inside
          # the runner's own stdlib (`could not import math/rand/v2`) rather
          # than in this repository. v2.13.1 is built with go1.27.0. If Lint
          # fails with errors whose paths point at hostedtoolcache rather than
          # at our files, this pin is what needs bumping.
          version: v2.13.1

  example-apps:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    name: Example Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [examples/tuitest, examples/stockterm, examples/optionterm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Stdlib-only module (no go.sum) — nothing to cache; disabling also
          # avoids setup-go's "Dependencies file is not found ... go.sum" warning.
          cache: false

      - name: Build and test
        working-directory: ${{ matrix.dir }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  tests-passed:
    # The single context branch protection requires. It always reports, so it is
    # always a decision rather than a silence.
    name: Tests passed
    needs: [changes, unit-tests, govulncheck, negative-compile, lint, example-apps, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require the suite to have passed, or to have been skipped for cause
        env:
          CODE: ${{ needs.changes.outputs.code }}
          R0: ${{ needs.unit-tests.result }}
          R1: ${{ needs.govulncheck.result }}
          R2: ${{ needs.negative-compile.result }}
          R3: ${{ needs.lint.result }}
          R4: ${{ needs.example-apps.result }}
          R5: ${{ needs.integration-tests.result }}
        run: |
          echo "gate said code=${CODE:-<nothing: the gate itself failed>}"
          echo "unit-tests: ${R0}"
          echo "govulncheck: ${R1}"
          echo "negative-compile: ${R2}"
          echo "lint: ${R3}"
          echo "example-apps: ${R4}"
          echo "integration-tests: ${R5}"

          # Two classes of job, because they skip for different reasons.
          #
          # STRICT jobs apply to every change, so the only acceptable skip is the
          # one this workflow's gate asked for. If the gate failed, CODE is empty,
          # the job skipped for some other reason, and a green here would cover
          # untested code.
          for result in "${R0}" "${R1}" "${R2}" "${R3}" "${R4}"; do
            case "$result" in
              success) ;;
              skipped)
                if [ "$CODE" != "false" ]; then
                  echo "A required job was skipped and the gate did not ask for it."
                  exit 1
                fi
                ;;
              *) echo "A required job reported: $result"; exit 1 ;;
            esac
          done

          # LENIENT jobs carry conditions of their own that predate this gate: the
          # live suite does not run on an ordinary push, and it does not run for
          # dependabot, which cannot read the token. Branch protection already
          # treats those skips as passing, so this must too. A FAILURE still
          # fails.
          for result in "${R5}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A conditional job reported: $result"; exit 1 ;;
            esac
          done
          echo "Every job passed, or skipped for a reason this gate accepts."
